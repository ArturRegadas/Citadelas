{# Drawer lateral "Minhas citações" — compartilhado entre as páginas #}
<div id="cd-saved-drawer" class="cd-drawer" hidden>
  <div class="cd-drawer__backdrop" data-cd-drawer-close tabindex="-1"></div>
  <aside class="cd-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="cd-saved-title">
    <header class="cd-drawer__head">
      <h2 class="cd-drawer__title" id="cd-saved-title">
        <i class="fa-solid fa-bookmark" aria-hidden="true" style="color: var(--cd-purple);"></i>
        Minhas citações
      </h2>
      <button type="button" class="cd-btn cd-btn--icon cd-btn--ghost" data-cd-drawer-close aria-label="Fechar painel de citações salvas">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="cd-drawer__body" id="cd-saved-list">
      {# Preenchido por JS. Estado vazio renderizado dinamicamente. #}
    </div>
  </aside>
</div>
