<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - HackApp</title>
    <link rel="shortcut icon"
        href="https://res.cloudinary.com/dnet6nodm/image/upload/v1761875332/Users_photos/frijvnfjk7rlwtwxktd5.png"
        type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/StyleLogIn.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-page-container {
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f8fafc;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
            padding: 35px 30px;
        }
        .login-card h2 {
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .login-card p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #334155;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #2563eb;
        }
        .btn-submit-login {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit-login:hover {
            background: #1d4ed8;
        }
        .btn-google {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
        .btn-google img {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>
    {% include "components/Header.html" %}

    <div class="login-page-container">
        <div class="login-card">
            <h2>Acessar Conta</h2>
            <p class="subtitle">Insira suas credenciais para continuar</p>

            {% if message %}
                <div class="alert alert-warning py-2 mb-3" style="font-size: 0.9rem;">
                    {{ message }}
                </div>
            {% endif %}

            <div id="login-alert" class="alert alert-danger py-2 mb-3 d-none" style="font-size: 0.9rem;"></div>

            <form id="standalone-login-form">
                <div class="form-group">
                    <label for="page-login-user">Email ou Nome de Usuário</label>
                    <input type="text" id="page-login-user" required placeholder="Digite seu email ou usuário">
                </div>

                <div class="form-group">
                    <div class="d-flex justify-content-between">
                        <label for="page-login-pass">Senha</label>
                        <a href="/change/now" style="font-size: 0.85rem; color: #2563eb; text-decoration: none;">Esqueceu?</a>
                    </div>
                    <input type="password" id="page-login-pass" required placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn-submit-login">Entrar</button>

                <button type="button" class="btn-google" onclick="window.location.href='/auth/google/redirect'">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/2048px-Google_%22G%22_logo.svg.png" alt="Google">
                    Entrar com Google
                </button>
            </form>

            <div class="text-center mt-4" style="font-size: 0.9rem; color: #64748b;">
                Não tem uma conta? <a href="{{ url_for('signUpPage.SignUpPage') }}" style="color: #2563eb; font-weight: 500; text-decoration: none;">Cadastre-se</a>
            </div>
        </div>
    </div>

    {% include "components/Footer.html" %}

    <script>
        document.getElementById("standalone-login-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const username = document.getElementById("page-login-user").value;
            const password = document.getElementById("page-login-pass").value;
            const alertBox = document.getElementById("login-alert");

            const formData = new FormData();
            formData.append("username", username);
            formData.append("password", password);

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    if (data.redirect) {
                        window.location.href = data.redirect;
                    } else {
                        window.location.href = "/";
                    }
                } else {
                    alertBox.textContent = data.InputError || data.error || "Credenciais inválidas.";
                    alertBox.classList.remove("d-none");
                }
            } catch (err) {
                alertBox.textContent = "Erro de conexão ao tentar fazer login.";
                alertBox.classList.remove("d-none");
            }
        });
    </script>
</body>

</html>
