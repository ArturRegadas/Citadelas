# ============================================================
# Docker Compose - AMBIENTE DE DESENVOLVIMENTO
# Para rodar na sua máquina:  docker compose up --build
# Sobe: Postgres + Redis + a app Flask (servidor de dev, hot-reload).
# A app fica em http://localhost:5000
# ============================================================

services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackathon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private_network

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - private_network

  web:
    build: .
    container_name: flask_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # Dentro da rede do compose, o banco é o host "db" (não localhost).
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://${POSTGRES_USER:-hackathon}:${POSTGRES_PASSWORD:-hackathon}@db:5432/${POSTGRES_DB:-hackathon}
      CACHE_TYPE: RedisCache
      CACHE_REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      # Monta o código para hot-reload em desenvolvimento.
      - ./:/app
    command: flask run --host=0.0.0.0 --port=5000
    networks:
      - public_network
      - private_network

volumes:
  pgdata:
  redis_data:

networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge